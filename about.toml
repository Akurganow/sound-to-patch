# cargo-about configuration: https://embarkstudios.github.io/cargo-about/
# Only what ships in the binaries needs a notice. The scan covers the
# workspace, so the few crates that only xtask uses get one too.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# For an `A OR B` expression the first accepted license wins.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Our own crate is not a third party.
[private]
ignore = true
