[package]
name = "sound-to-patch-host"
description = "The plug-in host process of sound-to-patch: loads a VST3 plug-in headless and renders notes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sound-to-patch = { path = ".." }

# Plug-ins render on macOS only, the one shipped target.
[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "stdio"] }
vst3-host = { version = "=0.10.0", default-features = false }
