# is named after its file.
# `--force` replaces the file of an earlier run.
bin.name = "sound-to-patch"
args = ["preset", "apply", "tests/cmd/data/three-edits.json", "--template", "tests/fixtures/vital/routes.vital", "-o", "target/Bass.vital", "--force"]
stdout = """
