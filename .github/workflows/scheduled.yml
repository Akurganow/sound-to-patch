name: Scheduled

# Reports that do not gate. Mutation, fuzz and property-soak jobs join with
# the epics that add their logic.
on:
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149,cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov nextest --workspace --profile ci --no-report
      - run: cargo llvm-cov report --html --output-dir target/coverage
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage

  # Five minutes per fuzz target on the pinned nightly, seeded from the
  # committed fixtures. A crash uploads its input.
  fuzz:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - working-directory: fuzz
        run: rustup toolchain install
      - working-directory: fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seed the corpus
        run: |
          for target in vital_read vital_roundtrip; do
            mkdir -p "fuzz/corpus/$target"
            find tests/fixtures/vital -name '*.vital' -exec cp {} "fuzz/corpus/$target/" \;
          done
          mkdir -p fuzz/corpus/edits_apply
          cp tests/cmd/data/*.json fuzz/corpus/edits_apply/
      # AddressSanitizer pads every global with a redzone, the constructor
      # pointers in `__mod_init_func` that tract registers with `ctor`
      # included. Apple's linker then reads the zero padding as pointers
      # with no target and stops. Globals go uninstrumented; stack and heap
      # checks stay on. cargo-fuzz adds RUSTFLAGS to its own flags.
      - working-directory: fuzz
        env:
          RUSTFLAGS: -Cllvm-args=-asan-globals=0
        run: |
          for target in vital_read vital_roundtrip vital_write edits_apply; do
            cargo fuzz run --fuzz-dir . "$target" -- -max_total_time=300
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # A failed scheduled run opens an issue, or comments on the open one, so
  # the failure reaches the repository's watchers by notification.
  report:
    needs: [coverage, fuzz]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COVERAGE: ${{ needs.coverage.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          title="The weekly scheduled run failed"
          body="$(printf 'Run: %s\n\n- coverage: %s\n- fuzz: %s\n\nA fuzz crash uploads its input as the `fuzz-artifacts` artifact of the run.\n' "$RUN_URL" "$COVERAGE" "$FUZZ")"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label kind:bug --label area:ci
          fi
