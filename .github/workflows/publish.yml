name: Publish

# Builds and publishes the release of a version tag. The release job in
# ci.yml pushes the tag. A failed run is re-run, or dispatched by hand with
# the tag name; a release that already exists is left alone.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish, for example v0.1.0.
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  publish:
    # Only the shipped target, and Apple targets build on Apple runners.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # cog changelog reads the history between tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-cog
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about@0.9.2

      # Only a version tag on main's history may publish; a tag on any other
      # commit, or a dispatch with another value, stops here.
      - name: Check the tag
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::$TAG is not a vX.Y.Z tag"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "refs/tags/$TAG" FETCH_HEAD \
            || { echo "::error::$TAG is not on main"; exit 1; }

      - name: Skip a release that already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the binary
        if: steps.existing.outputs.exists != 'true'
        run: cargo build --release --locked --target aarch64-apple-darwin

      # The host loads a plug-in in its own process. Vital 1.0.7 holds
      # x86_64 code only, so the host ships as a universal binary and runs
      # as x86_64 under Rosetta for such a plug-in.
      - name: Build the universal host
        if: steps.existing.outputs.exists != 'true'
        run: |
          rustup target add x86_64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p sound-to-patch-host --target "$target"
          done
          mkdir -p target/universal
          lipo -create -output target/universal/sound-to-patch-host \
            target/aarch64-apple-darwin/release/sound-to-patch-host \
            target/x86_64-apple-darwin/release/sound-to-patch-host
          # `-verify_arch` takes one architecture per call on this lipo.
          for arch in x86_64 arm64; do
            lipo target/universal/sound-to-patch-host -verify_arch "$arch" || {
              echo "::error::the host holds $(lipo -archs target/universal/sound-to-patch-host), with no $arch slice"
              exit 1
            }
          done

      # The binary must print the version of the tag it was built from.
      - name: Check the version
        if: steps.existing.outputs.exists != 'true'
        run: |
          printed="$(target/aarch64-apple-darwin/release/sound-to-patch --version)"
          echo "$printed"
          [ "$printed" = "sound-to-patch ${TAG#v}" ]
          # The x86_64 slice runs only where Rosetta is installed.
          archs="arm64"
          if [ -e /Library/Apple/usr/libexec/oah/libRosettaRuntime ]; then
            archs="arm64 x86_64"
          else
            echo "::warning::Rosetta is not installed, so the x86_64 slice of the host was not run"
          fi
          for arch in $archs; do
            printed="$(arch "-$arch" target/universal/sound-to-patch-host --version)"
            echo "$arch: $printed"
            [ "$printed" = "sound-to-patch-host ${TAG#v}" ]
          done

      - name: Pack the archive
        if: steps.existing.outputs.exists != 'true'
        run: |
          name="sound-to-patch-$TAG-aarch64-apple-darwin"
          stage="target/stage/$name"
          mkdir -p "$stage"
          cargo xtask dist --out-dir "$stage"
          cargo about generate --locked --fail -m host/Cargo.toml -c about.toml about.hbs -o "$stage/THIRD-PARTY-LICENSES.html"
          grep -q '>vst3-host ' "$stage/THIRD-PARTY-LICENSES.html"
          cp target/aarch64-apple-darwin/release/sound-to-patch target/universal/sound-to-patch-host LICENSE "$stage/"
          mkdir -p target/assets
          tar -czf "target/assets/$name.tar.gz" -C target/stage "$name"
          cp "$stage/THIRD-PARTY-LICENSES.html" target/assets/

      # Each plugin folder ships alone, so an agent harness installs a
      # plugin without the rest of the repository. The harness installs
      # plugin archives as zip.
      - name: Pack the plugins
        if: steps.existing.outputs.exists != 'true'
        run: |
          for dir in plugins/*/; do
            [ -d "$dir" ] || continue
            plugin="$(basename "$dir")"
            zip="target/assets/$plugin-$TAG.zip"
            (cd plugins && zip -qr "../$zip" "$plugin")
            # A skill that links the shared reference must carry its files.
            for link in "$dir"skills/*/reference; do
              [ -L "$link" ] || continue
              skill="$(basename "$(dirname "$link")")"
              unzip -l "$zip" | grep -q " $plugin/skills/$skill/reference/README\.md$" \
                || { echo "::error::$zip lacks skills/$skill/reference/README.md"; exit 1; }
            done
          done

      - name: Publish the release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          cog changelog --at "$TAG" > "$notes"
          [ -s "$notes" ] || { echo "::error::no changelog section for $TAG"; exit 1; }
          printf '\n%s\n' "The archive holds \`sound-to-patch\` for Apple silicon and \`sound-to-patch-host\`, a universal binary for Apple silicon and Intel that \`render\` runs to load a plug-in." >> "$notes"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$notes" target/assets/*
