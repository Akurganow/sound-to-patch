name: CodeQL

# Advanced setup: the check name stays stable and the action pins go through
# review. Default setup stays off, because it blocks uploads from this file.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "20 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # The main ruleset requires this exact name.
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:rust
