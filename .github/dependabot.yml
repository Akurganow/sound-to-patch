version: 2
updates:
  # Keeps the SHA pins of the workflows and local actions current.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # A fresh release waits a week, so a compromised one can be pulled first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: ["kind:chore"]
