name: Bug
description: Something that does not work as documented.
labels: ["kind:bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `sound-to-serum --version`, or the commit you built.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The full output, including any error message.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: >
        The kind of input (stem type, preset, description). Attach a file only
        if you have the right to share it; never attach factory presets.
