name: Set up Rust
description: >
  Installs the latest stable toolchain with rustfmt and clippy. The hosted
  runners ship rustup, so no third-party action is needed for that. With
  `cache: "true"` it also restores the dependency build cache.
inputs:
  cache:
    description: >
      "true" restores the build cache of the dependencies, keyed by the
      lockfiles, the manifests and the compiler version. Only a run on main
      saves it, so a pull request reads the cache of main and cannot fill
      the repository quota.
    default: "false"
  cache-key:
    description: >
      Shares one cache between jobs that build the same thing, such as the
      xtask in two workflows. Empty keeps one cache per job.
    default: ""
  workspaces:
    description: >
      Cargo workspaces to cache, one `<workspace> -> <target>` per line, as
      Swatinem/rust-cache reads them. Empty caches the root workspace. The
      fuzz crate is a workspace of its own.
    default: ""
runs:
  using: composite
  steps:
    - name: Install stable Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
        rustup default stable
        rustc --version
    - name: Restore the build cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.workspaces }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
