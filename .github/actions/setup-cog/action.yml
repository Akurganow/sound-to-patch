name: Set up cocogitto
description: >
  Installs cog 7.0.0 from its release and checks the archive against the
  SHA-256 that GitHub records for the asset.
runs:
  using: composite
  steps:
    # The only GITHUB_PATH entry is a directory under RUNNER_TEMP.
    - name: Install cog
      shell: bash
      env:
        COG_VERSION: 7.0.0
      run: | # zizmor: ignore[github-env]
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            asset="cocogitto-$COG_VERSION-x86_64-unknown-linux-musl.tar.gz"
            sha256=e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb ;;
          macOS-ARM64)
            asset="cocogitto-$COG_VERSION-aarch64-apple-darwin.tar.gz"
            sha256=429303b6d68c6461aa221ab4de82b26d0bbcdee7127947ea9c7c411ab9bc574c ;;
          *) echo "::error::no pinned cog asset for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/cog"
        mkdir -p "$dir"
        curl --fail --location --silent --show-error --output "$dir/$asset" \
          "https://github.com/cocogitto/cocogitto/releases/download/$COG_VERSION/$asset"
        echo "$sha256  $dir/$asset" | shasum -a 256 -c -
        tar -xzf "$dir/$asset" -C "$dir"
        cog="$(find "$dir" -type f -name cog -perm -u+x | head -n 1)"
        [ -n "$cog" ] || { echo "::error::cog binary not found in $asset"; exit 1; }
        mkdir -p "$dir/bin"
        mv "$cog" "$dir/bin/cog"
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/cog" --version | grep -F "$COG_VERSION"
