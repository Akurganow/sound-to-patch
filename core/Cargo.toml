[package]
name = "sound-to-patch-core"
description = "The render core of sound-to-patch that the plug-in host shares: units, audio, notes, the synth, the recipe and the wire protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The `--synth` value parser of the command line.
clap = ["dep:clap"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
approx = "0.5.1"
proptest = "1.12.0"
