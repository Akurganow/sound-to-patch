[package]
name = "sound-to-patch"
description = "Turn an audio stem or a written sound description into a starting point in Vital or Serum 2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://akurganow.github.io/sound-to-patch/api/sound_to_patch/"
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
basic-pitch-rs = { version = "=0.1.0", default-features = false, features = ["tract", "bundled-model", "serde"] }
biquad = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
colorous = "1.0.16"
font8x8 = "0.3.1"
midly = { version = "0.5.3", default-features = false, features = ["std"] }
png = "0.18.1"
pyin = "=1.2.0"
realfft = "3.5.0"
rubato = "=5.0.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "aiff"] }

[dev-dependencies]
approx = "0.5.1"
chordparser = "4.0.4"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
hound = "3.5.1"
insta = "1.49.0"
jsonschema = { version = "0.60.2", default-features = false }
proptest = "1.12.0"
rust-music-theory = "0.4.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
trycmd = "1.2.1"

[[bench]]
name = "notes"
harness = false

[workspace]
members = ["xtask"]

[workspace.package]
# `cargo xtask set-version` rewrites this line in the version commit.
version = "0.17.0"
edition = "2024"
# Set for the transcription crates of a later release, which need 1.91.
# Never below the highest MSRV among the dependencies, dev-dependencies
# included.
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/Akurganow/sound-to-patch"
publish = false

# Tests run FFTs of 100 000 points and more. Optimised dependencies keep a
# debug test run fast; our own code stays at the debug level.
[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
# A group needs a lower priority than the single lints in the same table.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
too_long_first_doc_paragraph = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
